[package]
name = "netwatch-core"
description = "Netwatch backend: network counters, disk usage, history and the tray icon renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "netwatch_core"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
resvg = "0.45"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSDictionary", "NSArray", "NSString", "NSValue", "NSError"] }

[dev-dependencies]
tempfile = "3"
