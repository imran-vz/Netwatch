[package]
name = "utilify-chef"
description = "Utilify's data workbench: CyberChef-style operations chained into recipes"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "utilify_chef"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
unicode-normalization = "0.1"
miniz_oxide = "0.8"

# Spec-first codecs from the utilify-codecs repository (sibling checkout).
utilify-js-json = { path = "../../../utilify-codecs/crates/utilify-js-json", features = ["serde_json"] }
utilify-base45 = { path = "../../../utilify-codecs/crates/utilify-base45" }
utilify-base58 = { path = "../../../utilify-codecs/crates/utilify-base58" }
utilify-base62 = { path = "../../../utilify-codecs/crates/utilify-base62" }
utilify-base85 = { path = "../../../utilify-codecs/crates/utilify-base85" }
utilify-base92 = { path = "../../../utilify-codecs/crates/utilify-base92" }
utilify-quoted-printable = { path = "../../../utilify-codecs/crates/utilify-quoted-printable" }
utilify-rfc2047 = { path = "../../../utilify-codecs/crates/utilify-rfc2047" }
utilify-codepages = { path = "../../../utilify-codecs/crates/utilify-codepages" }
utilify-html-entities = { path = "../../../utilify-codecs/crates/utilify-html-entities" }
utilify-cbor = { path = "../../../utilify-codecs/crates/utilify-cbor", features = ["utilify-js-json"] }
utilify-msgpack = { path = "../../../utilify-codecs/crates/utilify-msgpack", features = ["utilify-js-json"] }
utilify-avro = { path = "../../../utilify-codecs/crates/utilify-avro", features = ["utilify-js-json"] }
utilify-amf = { path = "../../../utilify-codecs/crates/utilify-amf", features = ["utilify-js-json"] }
utilify-rison = { path = "../../../utilify-codecs/crates/utilify-rison", features = ["utilify-js-json", "serde"] }
utilify-cobs = { path = "../../../utilify-codecs/crates/utilify-cobs" }
utilify-tlv = { path = "../../../utilify-codecs/crates/utilify-tlv" }
utilify-csv = { path = "../../../utilify-codecs/crates/utilify-csv", features = ["utilify-js-json"] }
utilify-hexdump = { path = "../../../utilify-codecs/crates/utilify-hexdump" }
utilify-asn1 = { path = "../../../utilify-codecs/crates/utilify-asn1" }
utilify-yaml-emit = { path = "../../../utilify-codecs/crates/utilify-yaml-emit" }

# Third-party libraries adopted in DEPENDENCIES.md.
ryu-js = "1.0.3"
num-bigint = "0.5.1"
num-traits = "0.2"
data-encoding = "2.11"
base64 = "0.22"
percent-encoding = "2.3"
url = "2.5"
idna = "1.1"
bech32 = "0.12"
saphyr = "0.2"
saphyr-parser = "0.2"
stacker = "0.1.25"
tempfile = "3"
regress = { version = "0.12", default-features = false, features = ["std"] }

[dev-dependencies]
regex = "1"
