[workspace]
resolver = "2"
members = [
    "crates/utilify-core",
    "crates/utilify-chef",
    "crates/utilify-app",
    "crates/utilify-smc",
    "crates/utilify-fanhelper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Imran"]

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
