[workspace]
resolver = "2"
members = [
    "crates/utilify-core",
    "crates/utilify-chef",
    "crates/utilify-app",
    "crates/utilify-smc",
    "crates/utilify-fanhelper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Imran"]

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# block 0.1.6 (via metal and cocoa, pulled in by gpui-kit) declares an extern
# static of an uninhabited type, which a future Rust will reject. The vendored
# copy swaps that type for an opaque struct. Drop this once gpui stops using
# block 0.1.
[patch.crates-io]
block = { path = "vendor/block" }
