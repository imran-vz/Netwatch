name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Enable SAND_RUNNERS_ENABLED only after the SSD-backed slot is online.
# Trusted jobs use an ephemeral macOS ARM64 Tart VM managed by Sand.
# VM images, disks and runner workspaces live on /Volumes/SN770 on the host.
# Fork and Dependabot PRs stay on GitHub-hosted macOS.

jobs:
  check:
    timeout-minutes: 60
    runs-on: ${{ vars.SAND_RUNNERS_ENABLED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && github.actor != 'dependabot[bot]' && fromJSON('["self-hosted","macOS","ARM64","utilify","sand"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
